version: 2

sources:
  - name: jaffle_shop
    # Course default is `raw.jaffle_shop`, and this deliberately is not that: `raw.jaffle_shop`
    # already holds a *different* jaffle_shop dataset with colliding `customers` and `orders`
    # tables, read by another project and a scheduled production job. Keep these separate.
    #
    # BigQuery has project.dataset.table where Snowflake had database.schema.table, one level
    # shallower, so `raw_mesh` + `jaffle_shop` collapses into the single dataset
    # `raw_mesh_jaffle_shop`. `database:` is omitted rather than set to the GCP project id:
    # dbt defaults it to the target's project, which keeps that id out of this public repo.
    schema: raw_mesh_jaffle_shop
    description: E-commerce data
    tables:
      - name: customers
        description: One record per person who has purchased one or more items
      - name: orders
        description: One record per order (consisting of one or more order items)
      - name: items
        description: Items included in an order
      - name: stores
        description: One record per physical store location
      - name: products
        description: One record per SKU for items sold in stores
      - name: supplies
        description: One record per supply per SKU of items sold in stores
