version: 2

sources:
  - name: jaffle_shop
    # Course default is `raw`, changed to `raw_mesh`. raw.jaffle_shop already holds a
    # different jaffle_shop dataset with colliding `customers` and `orders` tables,
    # read by another project and a scheduled production job. Keep these separate.
    database: raw_mesh
    schema: jaffle_shop
    description: E-commerce data
    tables:
      - name: customers
        description: One record per person who has purchased one or more items
      - name: orders
        description: One record per order (consisting of one or more order items)
      - name: items
        description: Items included in an order
      - name: stores
      - name: products
        description: One record per SKU for items sold in stores
      - name: supplies
        description: One record per supply per SKU of items sold in stores
